<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КиСА // Экзаменационный Тренажер (В. И. Кириллов)</title>
  <meta name="description" content="100 экзаменационных вопросов по квалиметрии и системному анализу с двухэтажными формулами.">
  
  <!-- Local KaTeX with CDN Fallback -->
  <link rel="stylesheet" href="./katex/katex.min.css">
  <script src="./katex/katex.min.js"></script>
  <script src="./katex/contrib/auto-render.min.js"></script>
  <script>
    if (!window.katex) {
      document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">');
      document.write('<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"><\/script>');
      document.write('<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"><\/script>');
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #090a0f;
      --surface: #12131c;
      --surface-2: #1a1c29;
      --surface-3: #232638;
      --border: #2c3047;
      --border-bright: #3d4363;
      --accent: #00f0ff;
      --accent-dim: rgba(0, 240, 255, 0.12);
      --accent-gold: #ffb700;
      --text: #d8dbe8;
      --text-dim: #7f85a3;
      --text-bright: #ffffff;
      --correct: #00ff88;
      --correct-dim: rgba(0, 255, 136, 0.12);
      --wrong: #ff3366;
      --wrong-dim: rgba(255, 51, 102, 0.12);
      --missed: #ffaa00;
      --missed-dim: rgba(255, 170, 0, 0.12);
      --mono: 'JetBrains Mono', 'Cambria Math', monospace;
      --display: 'Unbounded', sans-serif;
    }

    body {
      font-family: var(--mono);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    header {
      border-bottom: 2px solid var(--accent);
      padding: 20px 16px;
      background: var(--surface);
    }
    .header-content {
      max-width: 940px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    h1 {
      font-family: var(--display);
      font-size: clamp(1.1rem, 3.2vw, 1.6rem);
      font-weight: 900;
      color: var(--text-bright);
      letter-spacing: -0.03em;
    }
    h1 span { color: var(--accent); }

    .reset-stats-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 0.65rem;
      padding: 6px 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      transition: all 0.2s;
    }
    .reset-stats-btn:hover {
      color: var(--wrong);
      border-color: var(--wrong);
    }

    .container {
      max-width: 940px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 80px;
      flex: 1;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px;
      margin-bottom: 20px;
      background: var(--border);
      border: 2px solid var(--border);
    }
    .stat-cell {
      background: var(--surface);
      padding: 12px 8px;
      text-align: center;
    }
    .stat-num {
      font-family: var(--display);
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      font-weight: 800;
      color: var(--text-bright);
      line-height: 1;
    }
    .stat-num.s-ok { color: var(--correct); }
    .stat-num.s-err { color: var(--wrong); }
    .stat-num.s-pct { color: var(--accent); }
    .stat-lbl {
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--text-dim);
      margin-top: 5px;
    }

    .modes {
      display: flex;
      gap: 0;
      margin-bottom: 20px;
      border: 2px solid var(--border);
      overflow-x: auto;
    }
    .mode-btn {
      flex: 1;
      min-width: 0;
      padding: 12px 8px;
      background: var(--surface);
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: clamp(0.62rem, 1.8vw, 0.75rem);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border: none;
      border-right: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .mode-btn:last-child { border-right: none; }
    .mode-btn:hover { background: var(--surface-2); color: var(--text); }
    .mode-btn.active {
      background: var(--accent);
      color: #000000;
      font-weight: 800;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .tickets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .ticket-card {
      background: var(--surface);
      border: 2px solid var(--border);
      padding: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .ticket-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0, 240, 255, 0.1);
    }
    .ticket-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .ticket-tag {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      background: var(--accent-dim);
      padding: 3px 8px;
      font-weight: 700;
    }
    .ticket-count {
      font-size: 0.7rem;
      color: var(--text-dim);
    }
    .ticket-card h3 {
      font-family: var(--display);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 8px;
      line-height: 1.35;
    }
    .ticket-card p {
      font-size: 0.75rem;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .quiz-card {
      background: var(--surface);
      border: 2px solid var(--border);
      padding: 24px;
      margin-bottom: 16px;
    }
    .quiz-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-dim);
    }
    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: var(--border);
      margin-bottom: 20px;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }
    .question-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-bright);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }
    .option-item {
      background: var(--surface-2);
      border: 2px solid var(--border);
      padding: 14px 16px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      transition: all 0.15s ease;
    }
    .option-item:hover {
      border-color: var(--text-dim);
      background: var(--surface-3);
    }
    .option-item.selected {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .option-item.correct {
      border-color: var(--correct) !important;
      background: var(--correct-dim) !important;
    }
    .option-item.wrong {
      border-color: var(--wrong) !important;
      background: var(--wrong-dim) !important;
    }
    .option-item.missed {
      border-color: var(--missed) !important;
      background: var(--missed-dim) !important;
    }

    .control-indicator {
      width: 18px;
      height: 18px;
      border: 2px solid var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 3px;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .option-item.selected .control-indicator {
      border-color: var(--accent);
      background: var(--accent);
    }
    .option-item.correct .control-indicator {
      border-color: var(--correct);
      background: var(--correct);
    }
    .option-item.wrong .control-indicator {
      border-color: var(--wrong);
      background: var(--wrong);
    }
    .option-item.missed .control-indicator {
      border-color: var(--missed);
      background: var(--missed);
    }
    .control-indicator::after {
      content: '';
      display: none;
      width: 6px;
      height: 6px;
      background: #000000;
    }
    .option-item.selected .control-indicator::after,
    .option-item.correct .control-indicator::after,
    .option-item.wrong .control-indicator::after,
    .option-item.missed .control-indicator::after {
      display: block;
    }

    .option-text {
      font-size: 0.92rem;
      line-height: 1.7;
      color: var(--text);
    }
    .option-item.selected .option-text { color: var(--text-bright); }

    /* Real 2-Story KaTeX Formulas Styling */
    .katex {
      font-size: 1.15em !important;
      color: #ffd000 !important;
    }
    .katex-display {
      margin: 0.5em 0 !important;
    }
    .katex .frac-line {
      border-bottom-color: #ffd000 !important;
    }

    .explanation-box {
      background: var(--surface-2);
      border-left: 4px solid var(--accent);
      padding: 16px;
      margin-bottom: 20px;
      font-size: 0.88rem;
      line-height: 1.7;
      display: none;
    }
    .explanation-box strong { color: var(--accent); }

    .actions-panel {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .btn {
      font-family: var(--display);
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 14px 24px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: var(--accent);
      color: #000000;
      flex: 1;
    }
    .btn-primary:hover:not(:disabled) {
      background: #33f3ff;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.4);
    }
    .btn-primary:disabled {
      background: var(--surface-3);
      color: var(--text-dim);
      cursor: not-allowed;
    }
    .btn-secondary {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: var(--surface-3);
      color: var(--text-bright);
    }

    .results-card {
      background: var(--surface);
      border: 2px solid var(--border);
      padding: 36px 24px;
      text-align: center;
    }
    .results-score {
      font-family: var(--display);
      font-size: 3rem;
      font-weight: 900;
      color: var(--accent);
      margin: 16px 0;
    }
    .results-score span {
      font-size: 1.5rem;
      color: var(--text-dim);
    }
    .results-text {
      font-size: 0.9rem;
      color: var(--text);
      max-width: 500px;
      margin: 0 auto 28px;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      .modes { flex-wrap: wrap; }
      .mode-btn { width: 50%; flex: none; }
      .mode-btn:nth-child(even) { border-right: none; }
      .mode-btn:nth-child(1), .mode-btn:nth-child(2) { border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <h1>КВАЛИМЕТРИЯ <span>// КиСА</span></h1>
      <button class="reset-stats-btn" onclick="resetStats()">Сбросить статистику</button>
    </div>
  </header>

  <div class="container">
    
    <div class="stats">
      <div class="stat-cell"><div class="stat-num" id="sTotal">0</div><div class="stat-lbl">Всего</div></div>
      <div class="stat-cell"><div class="stat-num s-ok" id="sOk">0</div><div class="stat-lbl">Верно</div></div>
      <div class="stat-cell"><div class="stat-num s-err" id="sErr">0</div><div class="stat-lbl">Ошибки</div></div>
      <div class="stat-cell"><div class="stat-num s-pct" id="sPct">—</div><div class="stat-lbl">Точность</div></div>
    </div>

    <div class="modes">
      <button class="mode-btn active" id="modeTicket" onclick="setMode('ticket')">// Билеты</button>
      <button class="mode-btn" id="modeRandom" onclick="setMode('random')">// 15 случайных</button>
      <button class="mode-btn" id="modeAll" onclick="setMode('all')">// Все вопросы</button>
      <button class="mode-btn" id="modeErrors" onclick="setMode('errors')">// Ошибки</button>
    </div>

    <div id="selectScreen" class="screen active">
      <div class="tickets-grid" id="ticketsContainer"></div>
    </div>

    <div id="quizScreen" class="screen">
      <div class="quiz-card">
        <div class="quiz-top">
          <span id="currentTicketTitle">Билет 1</span>
          <span id="progressText">Вопрос 1 из 10</span>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <div class="question-title" id="questionText">Текст вопроса...</div>
        <div class="options-list" id="optionsList"></div>
        <div class="explanation-box" id="explanationBox">
          <strong>💡 Пояснение:</strong>
          <div id="explanationText" style="margin-top: 6px;"></div>
        </div>
      </div>
      <div class="actions-panel">
        <button class="btn btn-secondary" onclick="exitToMenu()">← Меню</button>
        <button class="btn btn-primary" id="actionBtn" onclick="handleAction()" disabled>Ответить</button>
      </div>
    </div>

    <div id="resultsScreen" class="screen">
      <div class="results-card">
        <h2 style="font-family: var(--display); font-size: 1.3rem;">Тестирование завершено</h2>
        <div class="results-score" id="resultsScore">0 <span>/ 10</span></div>
        <p class="results-text" id="resultsText">Результат...</p>
        <button class="btn btn-primary" onclick="exitToMenu()">Выбрать другой билет</button>
      </div>
    </div>

  </div>

  <script>
    const ticketsData = {
  "1": {
    "title": "Билет 1: Основы квалиметрии и системного анализа, понятия качества и свойств",
    "description": "10 вопросов • Основы квалиметрии, ГОСТ 15467-79, свойства и показатели качества, системный эффект, энтропия Шеннона.",
    "questions": [
      {
        "text": "Какова главная цель и предмет исследования квалиметрии как научной дисциплины согласно ГОСТ 15467-79 и трудам В. И. Кириллова?",
        "options": [
          "а) Организация бухгалтерского баланса и финансового аудита промышленных предприятий.",
          "б) Исключительно поверка и метрологическая аттестация эталонных средств измерений электрических величин;",
          "в) Технологическое проектирование режимов механической обработки конструкционных материалов;",
          "г) Расчет рыночной равновесной цены потребительских товаров на основе динамики баланса спроса и предложения;",
          "д) Разработка методологии и математических методов количественной оценки качества всевозможных объектов (продукции, услуг, процессов);"
        ],
        "correct": [
          4
        ],
        "explanation": "Правильный ответ: д. Квалиметрия — это наука о способах измерения и количественной оценки качества объектов реального мира (продукции, процессов, услуг). Поверка СИ относится к метрологии (б), расчет рыночной цены — к микроэкономике (г), режимы обработки — к машиностроению (в), а бухучет — к финансам (а)."
      },
      {
        "text": "В теории квалиметрии разграничиваются понятия «свойство продукции» и «показатель качества». Какие из следующих утверждений точно отражают их соотношение? (выберите все верные варианты):",
        "options": [
          "а) Свойство — это объективная способность продукции проявляться при ее создании и эксплуатации, а показатель качества — количественная характеристика одного или нескольких свойств;",
          "б) Понятия свойства и показателя качества полностью тождественны и используются как синонимы.",
          "в) Показатель качества может быть как единичным (характеризующим одно свойство), так и комплексным (совокупность свойств);",
          "г) Свойство существует объективно независимо от факта его измерения, тогда как показатель качества требует выбора единиц измерения и методики оценивания;",
          "д) Свойство представляет собой числовую величину, а показатель качества является чисто качественной словесной категорией;"
        ],
        "correct": [
          0,
          2,
          3
        ],
        "explanation": "Правильные ответы: а, в, г. Свойство — это объективная техническая категория, существующая независимо от измерения, а показатель качества — его количественная мера (единичная или комплексная). Утверждения б и д ошибочны: свойство не является числом, и эти термины не синонимы."
      },
      {
        "text": "Какие из перечисленных групп показателей относятся к группе «Показателей назначения» промышленной продукции по ГОСТ 15467-79? (выберите все верные варианты):",
        "options": [
          "а) Интенсивность отказов электронных компонентов в течение гарантийного срока эксплуатации;",
          "б) Показатели функциональной эффективности (пропускная способность канала связи, быстродействие процессора);",
          "в) Показатели конструктивного состава (габаритные размеры, объем буферной памяти, масса блока);",
          "г) Показатели приспособляемости к режимам применения и внешним климатическим факторам;",
          "д) Удельная трудоемкость технического обслуживания и средняя стоимость планового ремонта."
        ],
        "correct": [
          1,
          2,
          3
        ],
        "explanation": "Правильные ответы: б, в, г. В квалиметрии показатели назначения делятся на функциональные, конструктивные и приспособляемости. Интенсивность отказов относится к надежности (а), а трудоемкость ТО — к показателям технологичности и эксплуатационных затрат (д)."
      },
      {
        "text": "Каково ключевое различие между категориями «Качество продукции» и «Уровень качества продукции»?",
        "options": [
          "а) Качество относится только к готовой продукции на складе, а уровень качества — к сырью и полуфабрикатам;",
          "б) Качество неизменно во времени, а уровень качества меняется каждый рабочий день согласно графику дежурств;",
          "в) Качество измеряется исключительно в рублях, а уровень качества — в процентах брака на производстве;",
          "г) Уровень качества — это относительная характеристика, основанная на сопоставлении совокупности показателей качества оцениваемого объекта с базовыми (эталонными) значениями;",
          "д) Между качеством и уровнем качества различий нет, это идентичные термины стандарта."
        ],
        "correct": [
          3
        ],
        "explanation": "Правильный ответ: г. Согласно ГОСТ 15467-79 и Кириллову, качество — совокупность свойств продукции, а уровень качества — относительная мера, полученная путем сопоставления показателей объекта с базовыми значениями (аналогами, эталонами)."
      },
      {
        "text": "Какие из приведенных научных принципов сформулированы в квалиметрии (по Г. Г. Азгальдову и В. И. Кириллову) как базовые правила оценивания? (выберите все верные варианты):",

      if (window.renderMathInElement) {
        try {
          window.renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false}
            ],
            throwOnError: false
          });
        } catch (err) {
          console.warn("KaTeX render notice:", err);
        }
      }
    }

    function shuffle(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function init() {
      const container = document.getElementById('ticketsContainer');
      container.innerHTML = '';
      
      const tIds = Object.keys(ticketsData).sort((a, b) => parseInt(a) - parseInt(b));
      
      tIds.forEach(id => {
        const ticket = ticketsData[id];
        const card = document.createElement('div');
        card.className = 'ticket-card';
        card.onclick = () => startTicket(id);
        
        card.innerHTML = `
          <div>
            <div class="ticket-card-header">
              <span class="ticket-tag">БЛОК #${id}</span>
              <span class="ticket-count">${ticket.questions.length} вопросов</span>
            </div>
            <h3>${ticket.title}</h3>
            <p>${ticket.description}</p>
          </div>
          <div style="margin-top: 14px; color: var(--accent); font-size: 0.72rem; font-weight: 700;">
            НАЧАТЬ ТЕСТ →
          </div>
        `;
        container.appendChild(card);
      });

      upStats();
      renderMath(container);
    }

    function upStats() {
      document.getElementById('sTotal').textContent = S.total;
      document.getElementById('sOk').textContent = S.ok;
      document.getElementById('sErr').textContent = S.err;
      document.getElementById('sPct').textContent = S.total ? Math.round(S.ok / S.total * 100) + '%' : '—';
    }

    function save() {
      safeStorage.setItem('kisa_s', JSON.stringify({ ok: S.ok, err: S.err, total: S.total }));
      safeStorage.setItem('kisa_e', JSON.stringify(S.errors));
    }

    function resetStats() {
      if (confirm("Вы уверены, что хотите сбросить всю статистику и ошибки по КиСА?")) {
        S.ok = 0; S.err = 0; S.total = 0; S.errors = [];
        save();
        upStats();
        if (S.mode === 'errors') setMode('ticket');
      }
    }

    function setMode(m) {
      S.mode = m;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      
      let btnId = 'modeTicket';
      if (m === 'random') btnId = 'modeRandom';
      else if (m === 'all') btnId = 'modeAll';
      else if (m === 'errors') btnId = 'modeErrors';
      document.getElementById(btnId).classList.add('active');
      
      const selectScreen = document.getElementById('selectScreen');
      const quizScreen = document.getElementById('quizScreen');
      const resultsScreen = document.getElementById('resultsScreen');
      
      if (m === 'ticket') {
        selectScreen.classList.add('active');
        quizScreen.classList.remove('active');
        resultsScreen.classList.remove('active');
      } else if (m === 'random') {
        let all = [];
        Object.keys(ticketsData).forEach(tId => {
          ticketsData[tId].questions.forEach((_, qIdx) => all.push({ tId, qIdx }));
        });
        shuffle(all);
        startCustomQuiz(all.slice(0, 15), "15 случайных вопросов по КиСА");
      } else if (m === 'all') {
        let all = [];
        Object.keys(ticketsData).forEach(tId => {
          ticketsData[tId].questions.forEach((_, qIdx) => all.push({ tId, qIdx }));
        });
        shuffle(all);
        startCustomQuiz(all, "Марафон: Все 100 вопросов по КиСА");
      } else if (m === 'errors') {
        if (!S.errors.length) {
          alert("Ошибок пока нет! Пройдите билеты, чтобы сформировать список ошибок.");
          setMode('ticket');
          return;
        }
        let errList = S.errors.map(k => {
          const parts = k.split('_');
          return { tId: parts[0], qIdx: parseInt(parts[1]) };
        });
        shuffle(errList);
        startCustomQuiz(errList, "Работа над ошибками КиСА");
      }
    }

    function startTicket(id) {
      S.ticket = id;
      S.qs = ticketsData[id].questions.map((_, i) => ({ tId: id, qIdx: i }));
      S.ci = 0;
      sessionScore = 0;
      
      document.getElementById('selectScreen').classList.remove('active');
      document.getElementById('resultsScreen').classList.remove('active');
      document.getElementById('quizScreen').classList.add('active');
      
      loadQuestion();
    }

    function startCustomQuiz(items, title) {
      S.qs = items;
      S.ci = 0;
      sessionScore = 0;
      
      document.getElementById('selectScreen').classList.remove('active');
      document.getElementById('resultsScreen').classList.remove('active');
      document.getElementById('quizScreen').classList.add('active');
      
      loadQuestion(title);
    }

    function loadQuestion(customTitle) {
      isAnswered = false;
      selectedIndices = [];
      
      const item = S.qs[S.ci];
      const q = ticketsData[item.tId].questions[item.qIdx];
      
      let title = customTitle || ticketsData[item.tId].title;
      if (S.mode === 'random') title = '15 случайных вопросов';
      else if (S.mode === 'all') title = 'Все вопросы';
      else if (S.mode === 'errors') title = 'Работа над ошибками';
      
      document.getElementById('currentTicketTitle').textContent = title;
      
      const total = S.qs.length;
      document.getElementById('progressText').textContent = `Вопрос ${S.ci + 1} из ${total}`;
      document.getElementById('progressBar').style.width = `${((S.ci + 1) / total) * 100}%`;
      
      const qTextEl = document.getElementById('questionText');
      qTextEl.textContent = q.text;
      
      document.getElementById('explanationBox').style.display = 'none';
      
      const list = document.getElementById('optionsList');
      list.innerHTML = '';
      
      const oi = q.options.map((_, i) => i);
      // Display options in natural alphabetical order (а, б, в, г, д)
      // Correct positions are already uniformly distributed across database
      
      oi.forEach(idx => {
        const opt = q.options[idx];
        const optionCard = document.createElement('div');
        optionCard.className = 'option-item';
        optionCard.dataset.idx = idx;
        optionCard.onclick = () => selectOption(idx, optionCard);
        
        optionCard.innerHTML = `
          <div class="control-indicator"></div>
          <div class="option-text">${opt}</div>
        `;
        list.appendChild(optionCard);
      });
      
      const actionBtn = document.getElementById('actionBtn');
      actionBtn.textContent = "Ответить";
      actionBtn.disabled = true;

      // Render KaTeX vertical formulas immediately
      renderMath(document.getElementById('quizScreen'));
    }

    function selectOption(index, el) {
      if (isAnswered) return;
      const pos = selectedIndices.indexOf(index);
      if (pos > -1) {
        selectedIndices.splice(pos, 1);
        el.classList.remove('selected');
      } else {
        selectedIndices.push(index);
        el.classList.add('selected');
      }
      document.getElementById('actionBtn').disabled = selectedIndices.length === 0;
    }

    function handleAction() {
      const actionBtn = document.getElementById('actionBtn');
      
      if (!isAnswered) {
        isAnswered = true;
        const item = S.qs[S.ci];
        const q = ticketsData[item.tId].questions[item.qIdx];
        const optionElements = document.querySelectorAll('.option-item');
        
        const correctSet = new Set(q.correct);
        const selectedSet = new Set(selectedIndices);
        
        let isCorrect = true;
        if (correctSet.size !== selectedSet.size) {
          isCorrect = false;
        } else {
          for (const idx of selectedSet) {
            if (!correctSet.has(idx)) {
              isCorrect = false;
              break;
            }
          }
        }
        
        S.total++;
        const qKey = `${item.tId}_${item.qIdx}`;
        
        if (isCorrect) {
          S.ok++;
          sessionScore++;
          const errPos = S.errors.indexOf(qKey);
          if (errPos > -1) S.errors.splice(errPos, 1);
        } else {
          S.err++;
          if (S.errors.indexOf(qKey) === -1) S.errors.push(qKey);
        }
        
        save();
        upStats();
        
        optionElements.forEach(el => {
          const idx = parseInt(el.dataset.idx);
          const isItemCorrect = correctSet.has(idx);
          const isItemSelected = selectedSet.has(idx);
          
          if (isItemCorrect) {
            if (isItemSelected) {
              el.classList.add('correct');
            } else {
              el.classList.add('missed');
            }
          } else if (isItemSelected) {
            el.classList.add('wrong');
          }
        });
        
        const expBox = document.getElementById('explanationBox');
        const expText = document.getElementById('explanationText');
        expText.textContent = q.explanation;
        expBox.style.display = 'block';

        renderMath(expBox);

        if (S.ci + 1 < S.qs.length) {
          actionBtn.textContent = "Следующий вопрос →";
        } else {
          actionBtn.textContent = "Завершить тест";
        }
      } else {
        if (S.ci + 1 < S.qs.length) {
          S.ci++;
          loadQuestion();
        } else {
          showResults();
        }
      }
    }

    function showResults() {
      document.getElementById('quizScreen').classList.remove('active');
      document.getElementById('resultsScreen').classList.add('active');
      
      const total = S.qs.length;
      document.getElementById('resultsScore').innerHTML = `${sessionScore} <span>/ ${total}</span>`;
      
      const pct = (sessionScore / total) * 100;
      let msg = "";
      if (pct === 100) {
        msg = "Идеально! 100% правильных ответов. Вы безупречно знаете квалиметрию и системный анализ!";
      } else if (pct >= 80) {
        msg = "Отличный результат! Высокий уровень знаний теории и методов В. И. Кириллова.";
      } else if (pct >= 50) {
        msg = "Хороший результат, но повторите математические модели и теорию решений.";
      } else {
        msg = "Тест не сдан. Рекомендуется повторить конспект и пособие Кириллова.";
      }
      document.getElementById('resultsText').textContent = msg;
    }

    function exitToMenu() {
      document.getElementById('quizScreen').classList.remove('active');
      document.getElementById('resultsScreen').classList.remove('active');
      document.getElementById('selectScreen').classList.add('active');
      setMode('ticket');
    }

    window.onload = init;
  </script>
</body>
</html>
