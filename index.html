<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ТНиС // ЭКЗАМЕН</title>
  <meta name="description" content="Тренажёр для подготовки к экзамену по ТНиС">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0c0c;
      --surface: #161616;
      --surface-2: #1e1e1e;
      --surface-3: #262626;
      --border-hard: #333;
      --border-accent: #e8ff00;
      --text: #e0e0e0;
      --text-dim: #777;
      --text-bright: #fff;
      --accent: #e8ff00;
      --accent-dim: rgba(232, 255, 0, 0.1);
      --correct: #00ff87;
      --correct-dim: rgba(0, 255, 135, 0.08);
      --wrong: #ff3333;
      --wrong-dim: rgba(255, 51, 51, 0.08);
      --mono: 'JetBrains Mono', 'Consolas', monospace;
      --display: 'Unbounded', sans-serif;
    }

    body {
      font-family: var(--mono);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* noise overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 16px 16px 100px;
    }

    /* ── HEADER ── */
    .header {
      border-bottom: 3px solid var(--accent);
      padding: 28px 0 18px;
      margin-bottom: 24px;
    }

    .header-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .header h1 {
      font-family: var(--display);
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 900;
      color: var(--text-bright);
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .header h1 span {
      color: var(--accent);
    }

    .header-tag {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      background: var(--surface);
      border: 1px solid var(--border-hard);
      padding: 4px 10px;
    }

    /* ── STATS ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px;
      margin-bottom: 20px;
      background: var(--border-hard);
      border: 2px solid var(--border-hard);
    }

    .stat-cell {
      background: var(--surface);
      padding: 12px 8px;
      text-align: center;
    }

    .stat-num {
      font-family: var(--display);
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      font-weight: 800;
      color: var(--text-bright);
      line-height: 1;
    }

    .stat-num.s-ok { color: var(--correct); }
    .stat-num.s-err { color: var(--wrong); }
    .stat-num.s-pct { color: var(--accent); }

    .stat-lbl {
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* ── MODES ── */
    .modes {
      display: flex;
      gap: 0;
      margin-bottom: 16px;
      border: 2px solid var(--border-hard);
      overflow-x: auto;
    }

    .mode-btn {
      flex: 1;
      min-width: 0;
      padding: 11px 6px;
      background: var(--surface);
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: clamp(0.6rem, 1.6vw, 0.72rem);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border: none;
      border-right: 1px solid var(--border-hard);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .mode-btn:last-child { border-right: none; }
    .mode-btn:hover { background: var(--surface-2); color: var(--text); }
    .mode-btn.active {
      background: var(--accent);
      color: var(--bg);
      font-weight: 800;
    }

    /* ── TICKET GRID ── */
    .tickets {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
      gap: 0;
      margin-bottom: 20px;
      border: 2px solid var(--border-hard);
      background: var(--border-hard);
    }

    .t-btn {
      aspect-ratio: 1;
      background: var(--surface);
      color: var(--text-dim);
      font-family: var(--display);
      font-size: 0.85rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.12s;
      border: 1px solid transparent;
    }

    .t-btn:hover { background: var(--surface-3); color: var(--text); border-color: var(--accent); }
    .t-btn.active { background: var(--accent); color: var(--bg); }

    /* ── PROGRESS ── */
    .progress {
      margin-bottom: 20px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      margin-bottom: 5px;
    }

    .progress-bar {
      height: 3px;
      background: var(--surface-3);
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.3s ease;
      width: 0%;
    }

    /* ── QUESTION ── */
    .q-card {
      border: 2px solid var(--border-hard);
      padding: 24px 20px;
      margin-bottom: 12px;
      background: var(--surface);
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-hard);
    }

    .q-num {
      font-family: var(--display);
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.06em;
    }

    .q-topic {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-dim);
    }

    .q-text {
      font-size: clamp(0.88rem, 2.2vw, 1rem);
      font-weight: 500;
      line-height: 1.65;
      color: var(--text-bright);
      margin-bottom: 20px;
      font-family: var(--mono);
    }

    /* ── OPTIONS ── */
    .opts {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .opt {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      padding: 13px 16px;
      border: 2px solid var(--border-hard);
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: clamp(0.78rem, 2vw, 0.88rem);
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      line-height: 1.55;
      transition: border-color 0.12s, background 0.12s, transform 0.1s;
    }

    .opt:hover:not(.locked) {
      border-color: var(--accent);
      background: var(--accent-dim);
      transform: translateX(4px);
    }

    .opt-key {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border: 2px solid var(--border-hard);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--display);
      font-weight: 800;
      font-size: 0.65rem;
      color: var(--text-dim);
      transition: all 0.12s;
      margin-top: 1px;
    }

    .opt:hover:not(.locked) .opt-key {
      border-color: var(--accent);
      color: var(--accent);
    }

    .opt.is-correct {
      border-color: var(--correct);
      background: var(--correct-dim);
      cursor: default;
    }
    .opt.is-correct .opt-key { border-color: var(--correct); color: var(--correct); background: transparent; }

    .opt.is-wrong {
      border-color: var(--wrong);
      background: var(--wrong-dim);
      cursor: default;
    }
    .opt.is-wrong .opt-key { border-color: var(--wrong); color: var(--wrong); }

    .opt.locked {
      cursor: default;
      opacity: 0.35;
    }
    .opt.is-correct.locked, .opt.is-wrong.locked { opacity: 1; }

    /* ── FEEDBACK ── */
    .feedback {
      margin-top: 14px;
      padding: 12px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.5;
      border-left: 4px solid;
      animation: slideUp 0.2s ease;
    }

    .feedback.fb-ok {
      border-color: var(--correct);
      color: var(--correct);
      background: var(--correct-dim);
    }

    .feedback.fb-err {
      border-color: var(--wrong);
      color: var(--wrong);
      background: var(--wrong-dim);
    }

    .feedback .fb-answer { color: var(--text); font-weight: 400; margin-top: 2px; }

    /* ── NEXT BTN ── */
    .next-btn {
      width: 100%;
      padding: 15px;
      border: 3px solid var(--accent);
      background: transparent;
      color: var(--accent);
      font-family: var(--display);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.15s;
      margin-top: 14px;
    }

    .next-btn:hover {
      background: var(--accent);
      color: var(--bg);
    }

    /* ── WELCOME ── */
    .welcome {
      text-align: center;
      padding: 50px 0;
      border: 2px solid var(--border-hard);
      background: var(--surface);
    }

    .welcome-icon {
      font-size: 2.5rem;
      margin-bottom: 14px;
      filter: grayscale(0.4);
    }

    .welcome h2 {
      font-family: var(--display);
      font-size: clamp(1rem, 3vw, 1.3rem);
      font-weight: 800;
      color: var(--text-bright);
      margin-bottom: 8px;
    }

    .welcome p {
      color: var(--text-dim);
      font-size: 0.78rem;
      max-width: 400px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* ── RESULTS ── */
    .results {
      animation: slideUp 0.35s ease;
    }

    .r-hero {
      text-align: center;
      border: 2px solid var(--border-hard);
      background: var(--surface);
      padding: 36px 20px 28px;
      margin-bottom: 16px;
    }

    .r-icon { font-size: 3rem; margin-bottom: 10px; filter: grayscale(0.3); }
    .r-title {
      font-family: var(--display);
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      font-weight: 900;
      color: var(--text-bright);
      margin-bottom: 4px;
    }
    .r-sub { color: var(--text-dim); font-size: 0.82rem; }

    .r-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      background: var(--border-hard);
      border: 2px solid var(--border-hard);
      margin-bottom: 16px;
    }

    .r-stat {
      background: var(--surface);
      padding: 18px 8px;
      text-align: center;
    }

    .r-stat .rv {
      font-family: var(--display);
      font-size: 1.8rem;
      font-weight: 800;
    }

    .r-stat .rl {
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .r-actions {
      display: flex;
      gap: 2px;
      margin-bottom: 20px;
    }

    .r-actions button {
      flex: 1;
      padding: 14px 8px;
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.15s;
    }

    .r-btn-primary {
      background: var(--accent);
      color: var(--bg);
      border: 2px solid var(--accent);
    }
    .r-btn-primary:hover { background: transparent; color: var(--accent); }

    .r-btn-sec {
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--border-hard);
    }
    .r-btn-sec:hover { border-color: var(--accent); color: var(--accent); }

    /* review */
    .review-title {
      font-family: var(--display);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--wrong);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--wrong);
    }

    .rev-item {
      border: 1px solid var(--border-hard);
      border-left: 4px solid var(--wrong);
      padding: 12px 14px;
      margin-bottom: 6px;
      background: var(--surface);
      font-size: 0.8rem;
    }

    .rev-q { font-weight: 600; color: var(--text); margin-bottom: 4px; line-height: 1.5; }
    .rev-yours { color: var(--wrong); font-size: 0.75rem; }
    .rev-right { color: var(--correct); font-size: 0.75rem; }

    /* ── KBD HINT ── */
    .kbd-hint {
      text-align: center;
      font-size: 0.6rem;
      color: var(--text-dim);
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .kbd-hint kbd {
      border: 1px solid var(--border-hard);
      padding: 1px 5px;
      font-family: var(--mono);
      font-size: 0.6rem;
    }

    /* ── HIDDEN ── */
    .hidden { display: none !important; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-hard); }

    /* ── MOBILE ── */
    @media (max-width: 500px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .tickets { grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); }
      .q-card { padding: 16px 14px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-top">
        <h1>ТНиС<span>//</span>ЭКЗАМЕН</h1>
        <span class="header-tag">тренажёр v2</span>
      </div>
    </header>

    <div class="stats" id="statsBar">
      <div class="stat-cell"><div class="stat-num" id="sTotal">0</div><div class="stat-lbl">всего</div></div>
      <div class="stat-cell"><div class="stat-num s-ok" id="sOk">0</div><div class="stat-lbl">верно</div></div>
      <div class="stat-cell"><div class="stat-num s-err" id="sErr">0</div><div class="stat-lbl">ошибки</div></div>
      <div class="stat-cell"><div class="stat-num s-pct" id="sPct">—</div><div class="stat-lbl">точность</div></div>
    </div>

    <div class="modes">
      <button class="mode-btn active" id="modeTicket" onclick="setMode('ticket')">// билеты</button>
      <button class="mode-btn" id="modeRandom" onclick="setMode('random')">// 17 случайных</button>
      <button class="mode-btn" id="modeAll" onclick="setMode('all')">// все вопросы</button>
      <button class="mode-btn" id="modeErrors" onclick="setMode('errors')">// ошибки</button>
    </div>

    <div class="tickets" id="ticketGrid"></div>

    <div class="progress hidden" id="progressWrap">
      <div class="progress-top">
        <span id="pLabel">вопрос 1/17</span>
        <span id="pPct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="pFill"></div></div>
    </div>

    <div id="welcomeScreen" class="welcome">
      <div class="welcome-icon">⌨</div>
      <h2>Выбери билет или режим</h2>
      <p>Вопросы — по реальным экзаменационным билетам. Билет 2 отсутствует в исходных данных.</p>
    </div>

    <div id="questionArea" class="hidden"></div>
    <div id="resultsScreen" class="hidden"></div>

    <div class="kbd-hint hidden" id="kbdHint">
      <kbd>1</kbd>–<kbd>5</kbd> ответ &nbsp;&bull;&nbsp; <kbd>enter</kbd> далее
    </div>
  </div>

<script>
const Q = [
  // ═══ Гос. системы ═══
  {q:"Результатом функционирования какой государственной системы является оценка соответствия требований регламентам и стандартам?",o:["НСТНиС","НСА","НСПС","Госстандарт","ЕАЭС"],c:2,t:"Гос.системы",tk:[1]},
  {q:"Результатом функционирования какой государственной системы являются установленные в регламентах и стандартах требования?",o:["НСПС","НСТНиС","НСА","Госстандарт","ТНиС"],c:1,t:"Гос.системы",tk:[3]},
  {q:"Результатом функционирования какой государственной системы является право субъектов хозяйствования на выполнение работ в определённой области?",o:["НСПС","НСТНиС","Госстандарт","НСА","ТНиС"],c:3,t:"Гос.системы",tk:[4]},

  // ═══ Цели ТНиС ═══
  {q:"Целью технического нормирования и стандартизации является:",o:["Регулирование торговли","Контроль производства","Развитие экспорта","Защита жизни","Лицензирование"],c:3,t:"Цели ТНиС",tk:[1]},
  {q:"Целью технического нормирования и стандартизации является:",o:["Регулирование импорта","Защита здоровья","Контроль цен","Налогообложение","Лицензирование"],c:1,t:"Цели ТНиС",tk:[3]},
  {q:"Целью технического нормирования и стандартизации является:",o:["Государственный контроль","Регулирование цен","Защита имущества","Регистрация предприятий","Контроль импорта"],c:2,t:"Цели ТНиС",tk:[4]},
  {q:"Целью технического нормирования и стандартизации является:",o:["Контроль экспорта","Регулирование торговли","Лицензирование","Регистрация","Охрана окружающей среды"],c:4,t:"Цели ТНиС",tk:[5]},
  {q:"Целью технического нормирования и стандартизации является:",o:["Повышение конкурентоспособности продукции","Государственный контроль","Налоговое регулирование","Управление предприятиями","Регулирование занятости"],c:0,t:"Цели ТНиС",tk:[6]},

  // ═══ Субъекты ═══
  {q:"Какой субъект хозяйствования определяет единую государственную политику в области ТНиС?",o:["Президент Республики Беларусь","Совет Министров","Госстандарт","Национальное собрание","Минэкономики"],c:0,t:"Субъекты",tk:[1]},
  {q:"Какой субъект хозяйствования осуществляет единую государственную политику в области ТНиС?",o:["Президент РБ","Совет Министров","Госстандарт","Минэкономики","Национальное собрание"],c:1,t:"Субъекты",tk:[3]},
  {q:"Какой субъект хозяйствования утверждает программу разработки технических регламентов РБ?",o:["Президент РБ","Совет Министров","Госстандарт","Национальное собрание","Технический комитет"],c:1,t:"Субъекты",tk:[4,10]},
  {q:"Какой субъект хозяйствования утверждает технический регламент?",o:["Президент РБ","Совет Министров","Госстандарт","Технический комитет","Минэкономики"],c:1,t:"Субъекты",tk:[5]},
  {q:"Какой субъект хозяйствования вводит в действие технический регламент?",o:["Президент РБ","Гос. комитет по стандартизации","Совет Министров","Технический комитет","Минэкономики"],c:1,t:"Субъекты",tk:[6]},
  {q:"Какой субъект хозяйствования осуществляет государственную регистрацию технических условий?",o:["Госстандарт","Совет Министров","Орган, уполномоченный Советом Министров","Президент РБ","Технический комитет"],c:2,t:"Субъекты",tk:[4,15]},

  {q:"«Соединение наружного и внутреннего размерных элементов при сборке» — это:",o:["Допуск","Отклонение","Зазор","Посадка","Натяг"],c:3,t:"Допуски",tk:[14]},
  {q:"При посадке с натягом:",o:["Отверстие больше вала","Вал больше отверстия","Размеры равны","Зазор может быть любым","Размеры не нормируются"],c:1,t:"Допуски",tk:[16,17]},
  {q:"При посадке с зазором:",o:["Вал больше отверстия","Отверстие больше вала","Размеры равны","Натяг обязателен","Размеры не нормируются"],c:1,t:"Допуски",tk:[16,17]},

  // ═══ Шероховатость ═══
  {q:"К основным параметрам нормального профиля поверхности относятся:",o:["Ra","Rz","Базовая длина","Rmax","Средний шаг"],c:2,t:"Шерохов.",tk:[1]},
  {q:"К основным параметрам нормального профиля поверхности относятся:",o:["Средняя линия профиля","Ra","Rz","Sm","tp"],c:0,t:"Шерохов.",tk:[4]},
  {q:"К основным параметрам нормального профиля поверхности относятся:",o:["Ra","Rz","Sm","tp","Отклонения профиля от средней линии"],c:4,t:"Шерохов.",tk:[5]},
  {q:"К стандартизованным параметрам шероховатости относятся:",o:["Базовая длина","Средняя линия","Высота выступов","Sm — средний шаг неровностей","Глубина впадин"],c:3,t:"Шерохов.",tk:[6]},
  {q:"Какой параметр шероховатости является предпочтительным?",o:["Rz","Rmax","Ra","Sm","tp"],c:2,t:"Шерохов.",tk:[9,15]},

  // ═══ Ряды ═══
  {q:"Основные ряды предпочтительных чисел содержат все целые степени:",o:["Двух","Пяти","Десяти","Ста","Тысячи"],c:2,t:"Ряды",tk:[14]},

  // ═══ Сигналы ═══
  {q:"«Мат. характеристики сигнала, рассматриваемого как единое целое» — это:",o:["Математические характеристики","Физические","Общие характеристики сигнала","Спектральные","Частные"],c:2,t:"Сигналы",tk:[4]},
  {q:"«Сигнал, мгновенные значения которого в любой момент известны» — это:",o:["Случайный","Периодический","Аналоговый","Детерминированный сигнал","Дискретный"],c:3,t:"Сигналы",tk:[6]},
  {q:"«Упорядоченный ряд отметок с последовательным рядом значений величины» — это:",o:["Диапазон","Шкала","Ряд","Градуировка","Калибровка"],c:1,t:"Сигналы",tk:[6]},

  // ═══ Принципы ═══
  {q:"Какой принцип ТНиС: «общее согласие без серьёзных возражений у большинства»?",o:["Открытость","Доступность","Консенсус","Оптимальность","Комплексность"],c:2,t:"Принципы",tk:[14,15,16,17]},
  {q:"Какой принцип ТНиС: «наилучшее сочетание эффекта и затрат»?",o:["Консенсус","Комплексность","Однозначность","Оптимальность","Целесообразность"],c:3,t:"Принципы",tk:[14,15,16,17]},
  {q:"Принцип «добровольность» ТНиС относится к применению:",o:["Технических регламентов","ТКП и гос. стандартов","Общегос. классификаторов","Всех ТНПА","Только стандартов организации"],c:1,t:"Принципы",tk:[14,15,16,17]},

  // ═══ Структура ═══
  {q:"Что на 2-м месте в наименовании стандарта?",o:["Групповой заголовок (система)","Заголовок (объект стандартизации)","Подзаголовок (аспект)","Номер стандарта","Год утверждения"],c:1,t:"Структура",tk:[17]},
  {q:"На каком месте подзаголовок в наименовании стандарта?",o:["На 1-м","На 2-м","На 3-м","На 4-м","В конце"],c:2,t:"Структура",tk:[16]},

  // ═══ Уровни ═══
  {q:"Стандартизация на международном уровне завершается принятием:",o:["СТБ","ISO","ГОСТ","EN","ANSI"],c:1,t:"Уровни",tk:[5]},
  {q:"Стандартизация на международном уровне завершается принятием:",o:["СТБ","ГОСТ","EN","ANSI","IEC"],c:4,t:"Уровни",tk:[6]},

  // ═══ Инф. безопасность ═══
  {q:"Стандартная модель информационной безопасности описывается категорией:",o:["Конфиденциальность","Целостность","Доступность","Апеллируемость","Авторизация"],c:3,t:"ИБ",tk:[4]},
];

// ═══════════════════════════════════════
const TK = {};
Q.forEach((q,i) => q.tk.forEach(t => { if(!TK[t])TK[t]=[]; TK[t].push(i); }));

let S = {
  mode:'ticket', ticket:null, qs:[], ci:0, ans:[], ok:0, err:0, total:0,
  errors: JSON.parse(localStorage.getItem('tnis_e')||'[]'), locked:false
};

const saved = JSON.parse(localStorage.getItem('tnis_s')||'{}');
if(saved.ok){S.ok=saved.ok;S.err=saved.err;S.total=saved.total;}

function $(id){return document.getElementById(id)}

function init(){
  const g=$('ticketGrid');
  const nums=Object.keys(TK).map(Number).sort((a,b)=>a-b);
  // Add note about missing ticket 2
  g.innerHTML=nums.map(t=>`<button class="t-btn" id="t${t}" onclick="pickTicket(${t})">${t}</button>`).join('');
  upStats();
}

function upStats(){
  $('sTotal').textContent=S.total;
  $('sOk').textContent=S.ok;
  $('sErr').textContent=S.err;
  $('sPct').textContent=S.total?Math.round(S.ok/S.total*100)+'%':'—';
}

function save(){
  localStorage.setItem('tnis_s',JSON.stringify({ok:S.ok,err:S.err,total:S.total}));
  localStorage.setItem('tnis_e',JSON.stringify(S.errors));
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function setMode(m){
  S.mode=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  $('mode'+m.charAt(0).toUpperCase()+m.slice(1)).classList.add('active');
  const tg=$('ticketGrid'),ws=$('welcomeScreen');

  if(m==='ticket'){
    tg.classList.remove('hidden');ws.classList.remove('hidden');
    $('questionArea').classList.add('hidden');$('resultsScreen').classList.add('hidden');
    $('progressWrap').classList.add('hidden');$('kbdHint').classList.add('hidden');
    ws.innerHTML=`<div class="welcome-icon">⌨</div><h2>Выбери билет</h2><p>Билет 2 отсутствует в исходных данных.</p>`;
  } else {
    tg.classList.add('hidden');ws.classList.add('hidden');
    if(m==='random'){go(shuffle(Array.from({length:Q.length},(_,i)=>i)).slice(0,17));}
    else if(m==='all'){go(shuffle(Array.from({length:Q.length},(_,i)=>i)));}
    else if(m==='errors'){
      if(!S.errors.length){ws.classList.remove('hidden');ws.innerHTML=`<div class="welcome-icon">▓</div><h2>Ошибок нет</h2><p>Все вопросы отвечены верно. Продолжай тренироваться.</p>`;return;}
      go(shuffle([...S.errors]));
    }
  }
}

function pickTicket(n){
  document.querySelectorAll('.t-btn').forEach(b=>b.classList.remove('active'));
  $('t'+n).classList.add('active');S.ticket=n;
  let idx=[...TK[n]];
  if(idx.length<17){
    const topics=new Set(idx.map(i=>Q[i].t));
    const extra=Q.map((_,i)=>i).filter(i=>!idx.includes(i)&&topics.has(Q[i].t));
    shuffle(extra);
    while(idx.length<17&&extra.length)idx.push(extra.pop());
    if(idx.length<17){const r=Q.map((_,i)=>i).filter(i=>!idx.includes(i));shuffle(r);while(idx.length<17&&r.length)idx.push(r.pop());}
  }
  go(shuffle(idx).slice(0,17));
}

function go(indices){
  S.qs=indices;S.ci=0;S.ans=[];S.locked=false;
  $('welcomeScreen').classList.add('hidden');$('resultsScreen').classList.add('hidden');
  $('questionArea').classList.remove('hidden');$('progressWrap').classList.remove('hidden');$('kbdHint').classList.remove('hidden');
  render();
}

function render(){
  S.locked=false;
  const qi=S.qs[S.ci],q=Q[qi],tot=S.qs.length,n=S.ci+1;
  const pct=Math.round(S.ci/tot*100);
  $('pLabel').textContent=`вопрос ${n}/${tot}`;
  $('pPct').textContent=pct+'%';
  $('pFill').style.width=pct+'%';

  const oi=q.o.map((_,i)=>i);shuffle(oi);
  const keys=['1','2','3','4','5'];

  $('questionArea').innerHTML=`
    <div class="q-card">
      <div class="q-meta">
        <span class="q-num">#${n}/${tot}</span>
        <span class="q-topic">${q.t}</span>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="opts" id="optsList">
        ${oi.map((o,d)=>`<button class="opt" data-oi="${o}" data-di="${d}" onclick="pick(${qi},${o},this)"><span class="opt-key">${keys[d]}</span><span>${q.o[o]}</span></button>`).join('')}
      </div>
      <div id="fbArea"></div>
      <button class="next-btn hidden" id="nextBtn" onclick="next()">${S.ci<S.qs.length-1?'далее →':'результаты →'}</button>
    </div>`;
}

function pick(qi,oi,btn){
  if(S.locked)return;S.locked=true;
  const q=Q[qi],ok=oi===q.c;
  S.total++;
  if(ok){S.ok++;S.errors=S.errors.filter(i=>i!==qi);}
  else{S.err++;if(!S.errors.includes(qi))S.errors.push(qi);}
  S.ans.push({qi,sel:oi,ok});
  upStats();save();

  document.querySelectorAll('.opt').forEach(b=>{
    const o=+b.dataset.oi;
    b.classList.add('locked');
    if(o===q.c)b.classList.add('is-correct');
    else if(b===btn&&!ok)b.classList.add('is-wrong');
  });

  $('fbArea').innerHTML=ok
    ?`<div class="feedback fb-ok">// верно</div>`
    :`<div class="feedback fb-err">// неверно<div class="fb-answer">→ ${q.o[q.c]}</div></div>`;
  $('nextBtn').classList.remove('hidden');
}

function next(){S.ci++;S.ci>=S.qs.length?results():render();}

function results(){
  $('questionArea').classList.add('hidden');$('progressWrap').classList.add('hidden');$('kbdHint').classList.add('hidden');
  const ok=S.ans.filter(a=>a.ok).length,tot=S.ans.length,pct=Math.round(ok/tot*100);
  let icon,title;
  if(pct>=90){icon='█';title='отлично';}
  else if(pct>=70){icon='▓';title='хорошо';}
  else if(pct>=50){icon='▒';title='можно лучше';}
  else{icon='░';title='нужно повторить';}

  const wrongs=S.ans.filter(a=>!a.ok);
  const rs=$('resultsScreen');rs.classList.remove('hidden');
  rs.innerHTML=`<div class="results">
    <div class="r-hero"><div class="r-icon">${icon}</div><div class="r-title">${title}</div><div class="r-sub">${ok} из ${tot}</div></div>
    <div class="r-stats">
      <div class="r-stat"><div class="rv" style="color:var(--correct)">${ok}</div><div class="rl">верно</div></div>
      <div class="r-stat"><div class="rv" style="color:var(--wrong)">${tot-ok}</div><div class="rl">ошибки</div></div>
      <div class="r-stat"><div class="rv" style="color:var(--accent)">${pct}%</div><div class="rl">точность</div></div>
    </div>
    <div class="r-actions">
      <button class="r-btn-primary" onclick="setMode('${S.mode}')">// ещё раз</button>
      <button class="r-btn-sec" onclick="setMode('ticket')">// билеты</button>
      ${wrongs.length?`<button class="r-btn-sec" onclick="setMode('errors')">// ошибки [${S.errors.length}]</button>`:''}
    </div>
    ${wrongs.length?`<div class="review-title">ошибки в этом тесте</div>${wrongs.map(a=>{const q=Q[a.qi];return`<div class="rev-item"><div class="rev-q">${q.q}</div><div class="rev-yours">✗ ${q.o[a.sel]}</div><div class="rev-right">→ ${q.o[q.c]}</div></div>`;}).join('')}`:''}
  </div>`;
}

document.addEventListener('keydown',e=>{
  if(e.key>='1'&&e.key<='5'){const bs=document.querySelectorAll('.opt');if(bs[+e.key-1]&&!S.locked)bs[+e.key-1].click();}
  if((e.key==='Enter'||e.key==='ArrowRight')&&S.locked){const nb=$('nextBtn');if(nb)nb.click();}
});

init();
</script>
</body>
</html>
