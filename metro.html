<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Законодательная Метрология // ТЕСТ</title>
  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── ACCESS SCREENS ── */
    #accessScreen {
      position: fixed; inset: 0; z-index: 8000;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
    }
    #accessScreen .ac-box {
      max-width: 400px; width: 90%;
      text-align: center; padding: 40px 24px;
      border: 2px solid var(--border); background: var(--surface);
    }
    #accessScreen .ac-icon { font-size: 2.8rem; margin-bottom: 16px; }
    #accessScreen .ac-title {
      font-family: var(--display); font-size: 1.3rem; font-weight: 800;
      color: var(--text-bright); margin-bottom: 8px;
    }
    #accessScreen .ac-sub {
      font-size: 0.8rem; color: var(--text-dim); line-height: 1.6; margin-bottom: 20px;
    }
    #accessScreen .ac-btn {
      display: inline-block; padding: 12px 24px;
      background: var(--accent); color: var(--bg);
      font-family: var(--display); font-size: 0.82rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.08em;
      border: none; cursor: pointer; text-decoration: none;
      touch-action: manipulation;
    }
    #accessScreen.hidden { display: none !important; }

    :root {
      --bg: #080808;
      --surface: #121212;
      --surface-2: #1a1a1a;
      --surface-3: #222222;
      --border: #282828;
      --accent: #00ffcc;
      --accent-dim: rgba(0, 255, 204, 0.1);
      --text: #e0e0e0;
      --text-dim: #888;
      --text-bright: #ffffff;
      --correct: #00ff66;
      --correct-dim: rgba(0, 255, 102, 0.08);
      --wrong: #ff3366;
      --wrong-dim: rgba(255, 51, 102, 0.08);
      --mono: 'JetBrains Mono', monospace;
      --display: 'Unbounded', sans-serif;
    }

    body {
      font-family: var(--mono);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      border-bottom: 2px solid var(--accent);
      padding: 24px 16px;
      background: var(--surface);
    }
    .header-content {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    h1 {
      font-family: var(--display);
      font-size: clamp(1.1rem, 3.5vw, 1.8rem);
      font-weight: 900;
      color: var(--text-bright);
      letter-spacing: -0.04em;
    }
    h1 span { color: var(--accent); }

    /* ── STATS ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px;
      margin-bottom: 20px;
      background: var(--border);
      border: 2px solid var(--border);
    }
    .stat-cell {
      background: var(--surface);
      padding: 12px 8px;
      text-align: center;
    }
    .stat-num {
      font-family: var(--display);
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      font-weight: 800;
      color: var(--text-bright);
      line-height: 1;
    }
    .stat-num.s-ok { color: var(--correct); }
    .stat-num.s-err { color: var(--wrong); }
    .stat-num.s-pct { color: var(--accent); }
    .stat-lbl {
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* ── MODES ── */
    .modes {
      display: flex;
      gap: 0;
      margin-bottom: 16px;
      border: 2px solid var(--border);
      overflow-x: auto;
    }
    .mode-btn {
      flex: 1;
      min-width: 0;
      padding: 11px 6px;
      background: var(--surface);
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: clamp(0.6rem, 1.6vw, 0.72rem);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border: none;
      border-right: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .mode-btn:last-child { border-right: none; }
    .mode-btn:hover { background: var(--surface-2); color: var(--text); }
    .mode-btn.active {
      background: var(--accent);
      color: var(--bg);
      font-weight: 800;
    }

    /* ── MAIN CONTAINER ── */
    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 16px 80px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* ── TICKET SELECT SCREEN ── */
    .screen {
      display: none;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .screen.active { display: flex; flex-direction: column; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .grid-bento {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .bento-card {
      background: var(--surface);
      border: 2px solid var(--border);
      padding: 24px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .bento-card:hover {
      border-color: var(--accent);
      background: var(--surface-2);
      transform: translateY(-2px);
    }
    .bento-card h3 {
      font-family: var(--display);
      font-size: 1.1rem;
      color: var(--text-bright);
      margin-bottom: 12px;
    }
    .bento-card p {
      font-size: 0.8rem;
      color: var(--text-dim);
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .bento-action {
      align-self: flex-start;
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.08em;
    }

    /* ── QUIZ SCREEN ── */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 16px;
    }
    .quiz-title {
      font-family: var(--display);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-bright);
    }
    .progress-text {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 700;
    }
    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: var(--surface-3);
      margin-bottom: 24px;
    }
    .progress-bar {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-card {
      background: var(--surface);
      border: 2px solid var(--border);
      padding: 32px 24px;
      margin-bottom: 20px;
    }
    .question-text {
      font-family: var(--display);
      font-size: clamp(0.95rem, 3vw, 1.15rem);
      font-weight: 700;
      color: var(--text-bright);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 16px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }
    .option-item:hover {
      border-color: var(--text-dim);
      background: var(--surface-3);
    }
    .option-item.selected {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .option-item.correct {
      border-color: var(--correct) !important;
      background: var(--correct-dim) !important;
    }
    .option-item.wrong {
      border-color: var(--wrong) !important;
      background: var(--wrong-dim) !important;
    }

    /* Custom Checkbox */
    .control-indicator {
      width: 18px;
      height: 18px;
      border: 2px solid var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .option-item.selected .control-indicator {
      border-color: var(--accent);
      background: var(--accent);
    }
    .option-item.correct .control-indicator {
      border-color: var(--correct);
      background: var(--correct);
    }
    .option-item.wrong .control-indicator {
      border-color: var(--wrong);
      background: var(--wrong);
    }
    .control-indicator::after {
      content: '';
      display: none;
      width: 6px;
      height: 6px;
      background: var(--bg);
    }
    .option-item.selected .control-indicator::after,
    .option-item.correct .control-indicator::after,
    .option-item.wrong .control-indicator::after {
      display: block;
    }

    .option-text {
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--text);
    }
    .option-item.selected .option-text {
      color: var(--text-bright);
    }

    /* ── ACTION BUTTONS ── */
    .actions-panel {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 10px;
    }
    .btn {
      padding: 16px 28px;
      font-family: var(--display);
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--surface-2);
      border-color: var(--text-dim);
    }
    .btn-primary {
      background: var(--accent);
      color: var(--bg);
    }
    .btn-primary:hover {
      box-shadow: 0 0 15px var(--accent);
      transform: translateY(-1px);
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none !important;
      transform: none !important;
    }

    /* ── EXPLANATION BOX ── */
    .explanation-box {
      margin-top: 20px;
      padding: 20px;
      background: var(--surface-2);
      border-left: 4px solid var(--accent);
      display: none;
      animation: slideDown 0.3s ease forwards;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .explanation-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
      letter-spacing: 0.08em;
    }
    .explanation-text {
      font-size: 0.8rem;
      color: var(--text);
      line-height: 1.6;
    }

    /* ── RESULTS SCREEN ── */
    .results-card {
      background: var(--surface);
      border: 2px solid var(--border);
      padding: 40px 24px;
      text-align: center;
      margin-bottom: 24px;
    }
    .results-title {
      font-family: var(--display);
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--text-bright);
      margin-bottom: 12px;
    }
    .results-score {
      font-family: var(--display);
      font-size: 3rem;
      font-weight: 900;
      color: var(--accent);
      margin: 20px 0;
    }
    .results-score span {
      font-size: 1.5rem;
      color: var(--text-dim);
    }
    .results-text {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.6;
      max-width: 500px;
      margin: 0 auto 30px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .actions-panel {
        flex-direction: column-reverse;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- Access gate: shows during check, then hides or shows denied -->
  <div id="accessScreen">
    <div class="ac-box">
      <div class="ac-icon" id="acIcon">⏳</div>
      <div class="ac-title" id="acTitle">Проверка доступа</div>
      <div class="ac-sub" id="acSub">Пожалуйста, подождите...</div>
      <div id="acBtnWrap"></div>
    </div>
  </div>

  <header>
    <div class="header-content">
      <h1>ЗАКОНОДАТЕЛЬНАЯ <span>МЕТРОЛОГИЯ</span></h1>
      <button class="reset-stats-btn" onclick="resetStats()" style="background: none; border: 1px solid var(--border); color: var(--text-dim); font-family: var(--mono); font-size: 0.65rem; padding: 6px 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.08em; transition: all 0.2s;" onmouseover="this.style.color='var(--accent)'; this.style.borderColor='var(--accent)';" onmouseout="this.style.color='var(--text-dim)'; this.style.borderColor='var(--border)';">сбросить статистику</button>
    </div>
  </header>

  <div class="container">

    <!-- ── STATS BAR ── -->
    <div class="stats" id="statsBar">
      <div class="stat-cell"><div class="stat-num" id="sTotal">0</div><div class="stat-lbl">всего</div></div>
      <div class="stat-cell"><div class="stat-num s-ok" id="sOk">0</div><div class="stat-lbl">верно</div></div>
      <div class="stat-cell"><div class="stat-num s-err" id="sErr">0</div><div class="stat-lbl">ошибки</div></div>
      <div class="stat-cell"><div class="stat-num s-pct" id="sPct">—</div><div class="stat-lbl">точность</div></div>
    </div>

    <!-- ── MODES BAR ── -->
    <div class="modes">
      <button class="mode-btn active" id="modeTicket" onclick="setMode('ticket')">// билеты</button>
      <button class="mode-btn" id="modeRandom" onclick="setMode('random')">// 10 случайных</button>
      <button class="mode-btn" id="modeAll" onclick="setMode('all')">// все вопросы</button>
      <button class="mode-btn" id="modeErrors" onclick="setMode('errors')">// ошибки</button>
    </div>

    <!-- SCREEN 1: TICKET SELECT -->
    <div id="selectScreen" class="screen active">
      <h2 style="font-family: var(--display); font-size: 1.1rem; font-weight: 800; margin-bottom: 20px;">ВЫБЕРИТЕ ЭКЗАМЕНАЦИОННЫЙ БИЛЕТ:</h2>
      <div class="grid-bento" id="ticketsGrid">
        <!-- Bento tickets injected here -->
      </div>
    </div>

    <!-- SCREEN 2: QUIZ -->
    <div id="quizScreen" class="screen">
      <div class="quiz-header">
        <div class="quiz-title" id="currentTicketTitle">Билет</div>
        <div class="progress-text" id="progressText">Вопрос 1 из 10</div>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="question-card">
        <div class="question-text" id="questionText">Вопрос загружается...</div>
        <div class="options-list" id="optionsList">
          <!-- Options injected here -->
        </div>
        <div class="explanation-box" id="explanationBox">
          <div class="explanation-title">Пояснение законодательства:</div>
          <div class="explanation-text" id="explanationText">Обоснование правильного ответа...</div>
        </div>
      </div>

      <div class="actions-panel">
        <button class="btn btn-secondary" id="exitBtn" onclick="exitToMenu()">← Меню</button>
        <button class="btn btn-primary" id="actionBtn" onclick="handleAction()" disabled>Ответить</button>
      </div>
    </div>

    <!-- SCREEN 3: RESULTS -->
    <div id="resultsScreen" class="screen">
      <div class="results-card">
        <h2 class="results-title">Тестирование Завершено</h2>
        <div class="results-score" id="resultsScore">0 <span>/ 10</span></div>
        <p class="results-text" id="resultsText">Результат...</p>
        <button class="btn btn-primary" onclick="exitToMenu()">Выбрать другой билет</button>
      </div>
    </div>

  </div>

  <script>
    const ticketsData = {
  "1": {
    "title": "Билет 1",
    "description": "10 вопросов • Метрологическая прослеживаемость, реестры, статусы эталонов и законодательная метрология.",
    "questions": [
      {
        "text": "Свойство результата измерений, в соответствии с которым результат может быть связан со ссылкой через документированную непрерывную цепь калибровок, каждая из которых вносит вклад в неопределенность измерения - это:",
        "options": [
          "а) поверка;",
          "б) метрологическая аттестация;",
          "в) метрологическая прослеживаемость;",
          "г) метрологическая оценка;",
          "д) сличения."
        ],
        "correct": [
          2
        ],
        "explanation": "Это стандартное определение метрологической прослеживаемости (metrological traceability) согласно Международному словарю по метрологии (VIM 3) и Закону Республики Беларусь 'Об обеспечении единства измерений'."
      },
      {
        "text": "Совокупность сведения, формируемых Государственным комитетом по стандартизации Республики Беларусь, о средствах измерений, в отношении которых принято решение об утверждении типа средств измерений, и о выданных сертификатах об утверждении типа средств измерений - это:",
        "options": [
          "а) Государственный реестр средств измерений Республики Беларусь;",
          "б) Государственный реестр эталонов Республики Беларусь;",
          "в) Государственный реестр сертифицированных средств измерений Республики Беларусь;",
          "г) Государственный реестр измерений Республики Беларусь;",
          "д) Государственный реестр Республики Беларусь."
        ],
        "correct": [
          0
        ],
        "explanation": "Согласно статье 20 Закона Республики Беларусь 'Об обеспечении единства измерений', Государственный комитет по стандартизации формирует и ведет Государственный реестр средств измерений Республики Беларусь."
      },
      {
        "text": "Эталоны, применяемые в РБ, по статусу подразделяют на:",
        "options": [
          "а) национальные;",
          "б) первичные;",
          "в) исходные;",
          "г) рабочие;",
          "д) вторичные."
        ],
        "correct": [
          0,
          2,
          3
        ],
        "explanation": "Согласно статье 12 Закона РБ 'Об обеспечении единства измерений', эталоны единиц величин по своему статусу подразделяются на национальные, исходные и рабочие."
      },
      {
        "text": "Метрологические характеристики эталона, к которым устанавливаются обязательные требования:",
        "options": [
          "а) действительное значение или диапазон значений величины, воспроизводимой эталоном;",
          "б) расширенная неопределенность измерения или характеристики погрешности (НСП, случайная погрешность, пределы допускаемой погрешности) при воспроизведении и передаче размера единицы величины;",
          "в) гистерезис;",
          "г) чувствительность;",
          "д) методы исследования и применения эталона."
        ],
        "correct": [
          0,
          1
        ],
        "explanation": "Для эталонов устанавливаются жесткие обязательные требования к воспроизводимым значениям и к точностным характеристикам (расширенной неопределенности или погрешности) воспроизведения."
      },
      {
        "text": "Сфера действия законодательной метрологии распространяется на измерения, выполняемые при:",
        "options": [
          "а) проведении экспертиз;",
          "б) регистрации национальных спортивных рекордов;",
          "в) осуществлении геодезической и картографической деятельности;",
          "г) определении налоговой базы;",
          "д) регистрации международных спортивных рекордов."
        ],
        "correct": [
          0,
          2,
          3
        ],
        "explanation": "Согласно статье 16 Закона РБ 'Об обеспечении единства измерений', измерения при экспертизах, картографической/геодезической деятельности и расчете налогов входят в сферу законодательного контроля. Спортивные рекорды государством не контролируются."
      },
      {
        "text": "Единообразие средств измерений - это:",

      _data: {},
      getItem(key) {
        try {
          if (window.location.protocol !== 'file:' && window.localStorage) {
            return window.localStorage.getItem(key);
          }
        } catch (e) {}
        return this._data[key] !== undefined ? this._data[key] : null;
      },
      setItem(key, val) {
        try {
          if (window.location.protocol !== 'file:' && window.localStorage) {
            window.localStorage.setItem(key, val); return;
          }
        } catch (e) {}
        this._data[key] = val;
      }
    };

    let initialErrors = [];
    try {
      const errStr = safeStorage.getItem('metro_e');
      initialErrors = errStr ? JSON.parse(errStr) : [];
      if (!Array.isArray(initialErrors)) initialErrors = [];
    } catch (e) {
      initialErrors = [];
    }

    let S = {
      mode: 'ticket',
      ticket: null,
      qs: [], // Array of { tId, qIdx }
      ci: 0,
      ok: 0,
      err: 0,
      total: 0,
      errors: initialErrors
    };

    let saved = { ok: 0, err: 0, total: 0 };
    try {
      const savedStr = safeStorage.getItem('metro_s');
      if (savedStr) {
        const parsed = JSON.parse(savedStr);
        if (parsed && typeof parsed.ok === 'number') {
          saved = parsed;
        }
      }
    } catch (e) {}
    if (saved.total) {
      S.ok = saved.ok;
      S.err = saved.err;
      S.total = saved.total;
    }

    let currentTicket = null;
    let currentQuestionIndex = 0;
    let selectedIndices = [];
    let sessionScore = 0;
    let isAnswered = false;

    // Helper functions
    function shuffle(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function getAllQuestions() {
      const list = [];
      for (const [tId, ticket] of Object.entries(ticketsData)) {
        ticket.questions.forEach((q, qIdx) => {
          list.push({ tId, qIdx });
        });
      }
      return list;
    }

    // ── INITIALIZATION ──
    function init() {
      const grid = document.getElementById('ticketsGrid');
      grid.innerHTML = '';
      
      for (const [id, ticket] of Object.entries(ticketsData)) {
        const card = document.createElement('div');
        card.className = 'bento-card';
        card.onclick = () => startTicket(id);
        
        card.innerHTML = `
          <div>
            <h3>${ticket.title}</h3>
            <p>${ticket.description}</p>
          </div>
          <div class="bento-action">Начать тест →</div>
        `;
        grid.appendChild(card);
      }

      upStats();
    }

    // ── STATISTICS AND SAVING ──
    function upStats() {
      document.getElementById('sTotal').textContent = S.total;
      document.getElementById('sOk').textContent = S.ok;
      document.getElementById('sErr').textContent = S.err;
      document.getElementById('sPct').textContent = S.total ? Math.round(S.ok / S.total * 100) + '%' : '—';
    }

    function save() {
      safeStorage.setItem('metro_s', JSON.stringify({ ok: S.ok, err: S.err, total: S.total }));
      safeStorage.setItem('metro_e', JSON.stringify(S.errors));
    }

    function resetStats() {
      if (confirm("Вы уверены, что хотите сбросить всю статистику и ошибки по метрологии?")) {
        S.ok = 0; S.err = 0; S.total = 0; S.errors = [];
        save();
        upStats();
        if (S.mode === 'errors') {
          setMode('ticket');
        }
      }
    }

    // ── SET MODE ──
    function setMode(m) {
      S.mode = m;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      
      let btnId = 'modeTicket';
      if (m === 'random') btnId = 'modeRandom';
      else if (m === 'all') btnId = 'modeAll';
      else if (m === 'errors') btnId = 'modeErrors';
      document.getElementById(btnId).classList.add('active');
      
      const selectScreen = document.getElementById('selectScreen');
      const quizScreen = document.getElementById('quizScreen');
      const resultsScreen = document.getElementById('resultsScreen');
      
      if (m === 'ticket') {
        selectScreen.classList.add('active');
        quizScreen.classList.remove('active');
        resultsScreen.classList.remove('active');
      } else {
        selectScreen.classList.remove('active');
        resultsScreen.classList.remove('active');
        
        let list = [];
        if (m === 'random') {
          list = shuffle(getAllQuestions()).slice(0, 10);
        } else if (m === 'all') {
          list = shuffle(getAllQuestions());
        } else if (m === 'errors') {
          if (!S.errors.length) {
            alert("Ошибок нет! Вы ответили верно на все вопросы.");
            setMode('ticket');
            return;
          }
          const errList = [];
          S.errors.forEach(key => {
            const parts = key.split('_');
            if (parts.length === 2) {
              const tId = parts[0];
              const qIdx = parseInt(parts[1]);
              if (ticketsData[tId] && ticketsData[tId].questions[qIdx]) {
                errList.push({ tId, qIdx });
              }
            }
          });
          list = shuffle(errList);
        }
        
        go(list);
      }
    }

    // ── START QUIZ ──
    function startTicket(ticketId) {
      const list = [];
      ticketsData[ticketId].questions.forEach((_, qIdx) => {
        list.push({ tId: ticketId, qIdx });
      });
      
      currentTicket = ticketsData[ticketId];
      go(list);
    }

    function go(indices) {
      S.qs = indices;
      S.ci = 0;
      sessionScore = 0;
      
      document.getElementById('selectScreen').classList.remove('active');
      document.getElementById('resultsScreen').classList.remove('active');
      document.getElementById('quizScreen').classList.add('active');
      
      loadQuestion();
    }

    // ── LOAD QUESTION ──
    function loadQuestion() {
      isAnswered = false;
      selectedIndices = [];
      
      const item = S.qs[S.ci];
      const q = ticketsData[item.tId].questions[item.qIdx];
      
      // Update Title
      let title = ticketsData[item.tId].title;
      if (S.mode === 'random') title = '10 случайных вопросов';
      else if (S.mode === 'all') title = 'Все вопросы по метрологии';
      else if (S.mode === 'errors') title = 'Работа над ошибками';
      
      document.getElementById('currentTicketTitle').textContent = title;
      
      // Update progress
      const total = S.qs.length;
      document.getElementById('progressText').textContent = `Вопрос ${S.ci + 1} из ${total}`;
      document.getElementById('progressBar').style.width = `${((S.ci + 1) / total) * 100}%`;
      
      // Question and Explanation
      document.getElementById('questionText').textContent = q.text;
      document.getElementById('explanationBox').style.display = 'none';
      
      // Options (shuffled)
      const list = document.getElementById('optionsList');
      list.innerHTML = '';
      
      const oi = q.options.map((_, i) => i);
      shuffle(oi);
      
      oi.forEach(idx => {
        const opt = q.options[idx];
        const optionCard = document.createElement('div');
        optionCard.className = 'option-item';
        optionCard.dataset.idx = idx;
        optionCard.onclick = () => selectOption(idx, optionCard);
        
        optionCard.innerHTML = `
          <div class="control-indicator"></div>
          <div class="option-text">${opt}</div>
        `;
        list.appendChild(optionCard);
      });
      
      const actionBtn = document.getElementById('actionBtn');
      actionBtn.textContent = "Ответить";
      actionBtn.disabled = true;
    }

    // ── SELECT OPTION ──
    function selectOption(index, el) {
      if (isAnswered) return;
      
      const pos = selectedIndices.indexOf(index);
      if (pos > -1) {
        selectedIndices.splice(pos, 1);
        el.classList.remove('selected');
      } else {
        selectedIndices.push(index);
        el.classList.add('selected');
      }
      
      document.getElementById('actionBtn').disabled = selectedIndices.length === 0;
    }

    // ── ACTION BUTTON HANDLE ──
    function handleAction() {
      const actionBtn = document.getElementById('actionBtn');
      
      if (!isAnswered) {
        isAnswered = true;
        const item = S.qs[S.ci];
        const q = ticketsData[item.tId].questions[item.qIdx];
        const optionElements = document.querySelectorAll('.option-item');
        
        const correctSet = new Set(q.correct);
        const selectedSet = new Set(selectedIndices);
        
        let isCorrect = true;
        if (correctSet.size !== selectedSet.size) {
          isCorrect = false;
        } else {
          for (const idx of selectedSet) {
            if (!correctSet.has(idx)) {
              isCorrect = false;
              break;
            }
          }
        }
        
        S.total++;
        const qKey = `${item.tId}_${item.qIdx}`;
        
        if (isCorrect) {
          S.ok++;
          sessionScore++;
          const errPos = S.errors.indexOf(qKey);
          if (errPos > -1) S.errors.splice(errPos, 1);
        } else {
          S.err++;
          if (S.errors.indexOf(qKey) === -1) {
            S.errors.push(qKey);
          }
        }
        
        save();
        upStats();
        
        // Show correct / incorrect styling
        optionElements.forEach(el => {
          const idx = parseInt(el.dataset.idx);
          const isItemCorrect = correctSet.has(idx);
          const isItemSelected = selectedSet.has(idx);
          
          if (isItemCorrect) {
            el.classList.add('correct');
          } else if (isItemSelected) {
            el.classList.add('wrong');
          }
        });
        
        // Show explanation
        document.getElementById('explanationText').textContent = q.explanation;
        document.getElementById('explanationBox').style.display = 'block';
        
        // Update Action Button
        if (S.ci + 1 < S.qs.length) {
          actionBtn.textContent = "Следующий вопрос →";
        } else {
          actionBtn.textContent = "Завершить тест";
        }
      } else {
        if (S.ci + 1 < S.qs.length) {
          S.ci++;
          loadQuestion();
        } else {
          showResults();
        }
      }
    }

    // ── SHOW RESULTS ──
    function showResults() {
      document.getElementById('quizScreen').classList.remove('active');
      document.getElementById('resultsScreen').classList.add('active');
      
      const total = S.qs.length;
      document.getElementById('resultsScore').innerHTML = `${sessionScore} <span>/ ${total}</span>`;
      
      const pct = (sessionScore / total) * 100;
      let msg = "";
      if (pct === 100) {
        msg = "Идеальный результат! 100% правильных ответов. Вы превосходно знаете законодательную метрологию!";
      } else if (pct >= 80) {
        msg = "Отличный результат! Отличные знания нормативной базы.";
      } else if (pct >= 50) {
        msg = "Хороший результат, но есть куда стремиться. Почитайте пояснения к вопросам.";
      } else {
        msg = "Тест не пройден. Рекомендуется повторно изучить Закон РБ 'Об обеспечении единства измерений'.";
      }
      
      document.getElementById('resultsText').textContent = msg;
    }

    // ── EXIT TO MENU ──
    function exitToMenu() {
      document.getElementById('quizScreen').classList.remove('active');
      document.getElementById('resultsScreen').classList.remove('active');
      document.getElementById('selectScreen').classList.add('active');
      setMode('ticket');
    }

    // Run on startup
    window.onload = function() {
      checkAccess();
      init();
    };
  </script>
</body>
</html>
