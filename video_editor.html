<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Видео-Конвертер 16:9 для Fiverr</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #111118;
      --primary: #6c63ff;
      --text: #e8e8f0;
      --text-muted: #7a7a9a;
      --border: rgba(255, 255, 255, 0.07);
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: var(--card);
      padding: 30px;
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 { font-size: 1.5rem; margin-bottom: 20px; color: var(--primary); }
    .step { margin-bottom: 20px; text-align: left; }
    label { display: block; font-size: 0.9rem; margin-bottom: 10px; color: var(--text-muted); }
    input[type="file"] {
      width: 100%;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--text);
      cursor: pointer;
    }
    .preview-container {
      margin-top: 20px;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      position: relative;
    }
    #canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .controls { margin-top: 30px; display: flex; gap: 10px; justify-content: center; }
    button {
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:disabled { background: #444; cursor: not-allowed; }
    .status { margin-top: 15px; font-size: 0.8rem; color: var(--primary); }
    .instructions { font-size: 0.75rem; color: var(--text-muted); margin-top: 15px; }

    /* Hidden elements for processing */
    #hidden-video { display: none; }
    #hidden-audio { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Видео-Конвертер 16:9</h1>
    <p style="font-size: 0.9rem; margin-bottom: 30px;">Простой способ подготовить видео-портфолио для Fiverr.</p>

    <div class="step">
      <label>1. Выберите исходное видео (ваша запись):</label>
      <input type="file" id="video-input" accept="video/*" />
    </div>

    <div class="step">
      <label>2. Выберите фоновую музыку (опционально):</label>
      <input type="file" id="audio-input" accept="audio/*" />
    </div>

    <div class="preview-container">
      <canvas id="canvas" width="1920" height="1080"></canvas>
      <div id="loading-overlay" style="position: absolute; display: none; background: rgba(0,0,0,0.7); inset: 0; align-items: center; justify-content: center;">
        Загрузка...
      </div>
    </div>

    <div class="status" id="status-text">Готов к работе</div>

    <div class="controls">
      <button id="record-btn" class="btn-primary" disabled>Начать экспорт</button>
      <a id="download-btn" class="btn btn-primary" style="display: none; background: #00d4ff; padding: 12px 24px; text-decoration: none; align-items: center; gap: 8px;">Скачать результат</a>
    </div>

    <p class="instructions">
      <b>Инструкция:</b> После выбора видео нажмите "Начать экспорт". Браузер проиграет видео один раз для записи, после чего появится кнопка "Скачать".
    </p>
  </div>

  <video id="hidden-video" muted playsinline></video>
  <audio id="hidden-audio" loop></audio>

  <script>
    const videoInput = document.getElementById('video-input');
    const audioInput = document.getElementById('audio-input');
    const hiddenVideo = document.getElementById('hidden-video');
    const hiddenAudio = document.getElementById('hidden-audio');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const recordBtn = document.getElementById('record-btn');
    const downloadBtn = document.getElementById('download-btn');
    const statusText = document.getElementById('status-text');

    let isRecording = false;
    let chunks = [];
    let recorder;
    let stream;
    let canvasStream;

    // Background color for the 16:9 field
    const bgColor = '#0a0a0f';

    videoInput.onchange = function(e) {
      if (!this.files[0]) return;
      const url = URL.createObjectURL(this.files[0]);
      hiddenVideo.src = url;
      hiddenVideo.onloadeddata = () => {
        statusText.innerText = `Видео загружено (${Math.round(hiddenVideo.duration)} сек)`;
        recordBtn.disabled = false;
        drawInitialFrame();
      };
    };

    audioInput.onchange = function(e) {
      if (!this.files[0]) return;
      const url = URL.createObjectURL(this.files[0]);
      hiddenAudio.src = url;
    };

    function drawInitialFrame() {
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      const sc = Math.min(canvas.width / hiddenVideo.videoWidth, canvas.height / hiddenVideo.videoHeight);
      const w = hiddenVideo.videoWidth * sc;
      const h = hiddenVideo.videoHeight * sc;
      const x = (canvas.width - w) / 2;
      const y = (canvas.height - h) / 2;
      
      ctx.drawImage(hiddenVideo, x, y, w, h);
    }

    function process() {
      if (hiddenVideo.paused || hiddenVideo.ended) return;
      
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      const sc = Math.min(canvas.width / hiddenVideo.videoWidth, canvas.height / hiddenVideo.videoHeight);
      const w = hiddenVideo.videoWidth * sc;
      const h = hiddenVideo.videoHeight * sc;
      const x = (canvas.width - w) / 2;
      const y = (canvas.height - h) / 2;
      
      ctx.drawImage(hiddenVideo, x, y, w, h);
      
      requestAnimationFrame(process);
    }

    recordBtn.onclick = function() {
      if (isRecording) return;
      startRecording();
    };

    function startRecording() {
      isRecording = true;
      chunks = [];
      recordBtn.disabled = true;
      downloadBtn.style.display = 'none';
      statusText.innerText = "Идет экспорт... Не закрывайте вкладку.";

      hiddenVideo.currentTime = 0;
      hiddenVideo.play();
      if (hiddenAudio.src) {
        hiddenAudio.currentTime = 0;
        hiddenAudio.play();
      }

      process();

      canvasStream = canvas.captureStream(30);
      
      let finalStream;
      if (hiddenAudio.src) {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const dest = audioCtx.createMediaStreamDestination();
        const src = audioCtx.createMediaElementSource(hiddenAudio);
        src.connect(dest);
        src.connect(audioCtx.destination);
        
        finalStream = new MediaStream([
          ...canvasStream.getVideoTracks(),
          ...dest.stream.getAudioTracks()
        ]);
      } else {
        finalStream = canvasStream;
      }

      const options = { mimeType: 'video/webm;codecs=vp9' };
      if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options.mimeType = 'video/webm';
      }

      recorder = new MediaRecorder(finalStream, options);
      recorder.ondataavailable = e => {
        if (e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        downloadBtn.href = url;
        downloadBtn.download = 'fiverr_portfolio_16x9.webm';
        downloadBtn.style.display = 'inline-flex';
        statusText.innerText = "Экспорт готов! Нажмите кнопку Скачать.";
        recordBtn.disabled = false;
        if (hiddenAudio.src) hiddenAudio.pause();
      };

      recorder.start();

      hiddenVideo.onended = () => {
        recorder.stop();
        isRecording = false;
        // Clean up tracks
        finalStream.getTracks().forEach(t => t.stop());
      };
    }
  </script>
</body>
</html>
